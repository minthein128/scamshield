      Hello, sorry I messaged the wrong person, but your profile looks very kind.
      That's fine.
      3 weeks later
      Talking to you every day makes me so happy. I work in Singapore and I am very lonely.
      My uncle has a gold trading app called GoldWave Asia. It makes 5% profit a day, no loss guaranteed. I already withdrew 80,000 baht.
      Try topping up 10,000 baht first. Transfer to our mentor's account 123-4-56789-0. The promotion ends tonight, don't tell anyone.
