id: romance-th
file: ../public/v2/romance-th.png
language: th
home: TH
app: chat
scam_type: romance_pig_butchering
expected_verdict: danger
score_range: [65, 100]
families: [too_good, payment_route, pressure, identity]
source_text: |
  ฟ้า
  ออนไลน์
  สวัสดีค่ะ ขอโทษที่ทักผิดคนนะคะ แต่โปรไฟล์คุณดูใจดีมาก
  ไม่เป็นไรครับ
  3 สัปดาห์ต่อมา
  คุยกับคุณทุกวันทำให้ฉันมีความสุขมาก ฉันทำงานอยู่สิงคโปร์ เหงามากเลย
  ลุงของฉันมีแอปเทรดทองชื่อ GoldWave Asia ได้กำไรวันละ 5% รับประกันไม่ขาดทุน ฉันถอนได้แล้ว 80,000 บาท
  ลองเติมเงิน 10,000 บาทก่อนนะคะ โอนเข้าบัญชีพี่เลี้ยงของเรา เลขบัญชี 123-4-56789-0 โปรหมดคืนนี้ อย่าบอกใครนะ
must_mention:
  - id: top_up
    variants: ["10000", "10,000", "เติมเงิน"]
  - id: guaranteed_profit
    variants: ["5%", "รับประกัน", "ไม่ขาดทุน", "กำไร"]
  - id: account
    variants: ["บัญชี", "account"]
  - id: secrecy
    variants: ["อย่าบอกใคร", "ปิดบัง", "เป็นความลับ", "ความลับ"]
must_advise: [dont_pay, verify_trusted, block_report]
must_not:
  accuse: [ฟ้า, GoldWave Asia]
  advice: [โอนได้เลย]
translations:
  - language: en
    file: ../public/v2/romance-th.en.png
