<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>Google Sans Flex SemiBold</string></test><edit name="family" mode="assign" binding="strong"><string>Google Sans Flex</string></edit><edit name="weight" mode="assign"><const>semibold</const></edit></match>
  <match target="pattern"><test name="family"><string>Google Sans Flex Medium</string></test><edit name="family" mode="assign" binding="strong"><string>Google Sans Flex</string></edit><edit name="weight" mode="assign"><const>medium</const></edit></match>
</fontconfig>
